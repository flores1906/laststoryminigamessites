<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Lockpick Hub</title>
    <!-- Tailwind CSS para estilização limpa e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            user-select: none; 
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-[#121212] text-neutral-100 min-h-screen flex items-center justify-center p-4">

  <!-- Container Principal em Tom Cinzento Escuro -->
  <div class="w-full max-w-md bg-[#1e1e1e] border border-neutral-700/60 rounded-2xl shadow-2xl p-8 text-center space-y-6">
    
    <!-- Título do Hub -->
    <div class="flex items-center justify-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Hub de Lockpick</h1>
    </div>
    
    <p class="text-xs text-neutral-400">Escolhe qual o minijogo que pretendes treinar:</p>

    <!-- Botões do Menu em Tons de Cinzento -->
    <div class="space-y-4">
      <a href="lockpick-carro.html" class="block w-full py-4 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-900 border border-neutral-700/80 font-bold text-neutral-100 rounded-xl shadow-lg transition duration-150 ease-in-out text-center flex items-center justify-center space-x-2">
        <span>🚗 Lockpick Carro</span>
      </a>
      
      <a href="lockpick-casa.html" class="block w-full py-4 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-900 border border-neutral-700/80 font-bold text-neutral-100 rounded-xl shadow-lg transition duration-150 ease-in-out text-center flex items-center justify-center space-x-2">
        <span>🏠 Lockpick Casa</span>
      </a>
    </div>
    
  </div>

</body>
</html>
